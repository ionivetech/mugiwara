name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: "Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: "Install dependencies"
        run: bun install --frozen-lockfile

      # One gate, one definition. `bun run gate` in package.json is the single
      # source of truth — CI used to re-list the steps by hand and the two
      # drifted, omitting verify-install, gate-selftest, lane-base, verify-pack,
      # build-hooks and --check-doc-integrity. Five capabilities shipped dead
      # behind a green board because the documented gate was not the executed
      # gate. Add new checks to `gate`, never here.
      - name: "Full gate (single source of truth: package.json `gate`)"
        run: bun run gate

      - name: "Gate self-test (every gate must fail when it should)"
        run: bun scripts/gate-selftest.ts

      - name: "Smoke test (CLI --version)"
        run: node dist/mugiwara.js --version

  # Install lifecycle smoke on all three OSes. The script is portable (it runs
  # src/cli.ts directly and needs no bash). Only this runs on macOS and Windows:
  # the full gate and scripts/*.sh (savepoint, lane) are not run there, because
  # they need bash and are not verified on Windows. Ubuntu keeps the one gate.
  smoke:
    name: "Lifecycle smoke (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: "Install dependencies"
        run: bun install --frozen-lockfile

      - name: "Install, upgrade, uninstall for claude, opencode, codex, cursor"
        run: bun run smoke
