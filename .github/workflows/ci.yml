name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: "Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: "Install dependencies"
        run: bun install --frozen-lockfile

      - name: "Typecheck"
        run: bun run typecheck

      - name: "Unit tests"
        run: bun run test

      - name: "Build"
        run: bun run build

      - name: "Validate content (manifest + docs)"
        run: bun scripts/validate-content.ts --check-manifest --check-docs

      - name: "Validate eval cases"
        run: bun scripts/run-evals.ts

      - name: "Retrieval ranking eval"
        run: bun scripts/retrieval-eval.ts --json

      - name: "Plugin sync check"
        run: bun scripts/validate-content.ts --check-sync

      - name: "Conformance (3 harness tiers)"
        run: bun scripts/conformance.ts

      - name: "Smoke test (CLI --version)"
        run: node dist/mugiwara.js --version
