name: Manual Release

# Manual release from GitHub UI: after PRs merge into main, run this workflow,
# pick patch/minor/major (or an exact version), and it bumps the version,
# syncs the plugin manifests, commits + tags main, then publishes to npm and
# creates the GitHub Release — all in this one run.
#
# Why not trigger the Release workflow via the tag push? Pushes made with the
# GITHUB_TOKEN do not fire other workflows (GitHub limitation). So this
# workflow publishes directly instead of relying on the `v*` tag trigger.
#
# Usage: Actions tab -> "Manual Release" -> "Run workflow" -> choose version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump — patch | minor | major, or exact (e.g. 0.3.0)'
        required: true
        default: patch

concurrency:
  group: manual-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pre-flight checks (fail before touching main)
        run: |
          bun run typecheck
          bun run test
          bun run build
          bun scripts/validate-content.ts --check-manifest --check-docs --check-sync
          bun scripts/run-evals.ts
          bun scripts/retrieval-eval.ts

      - name: Bump version
        run: echo "RELEASE_VERSION=$(npm version "${{ inputs.version }}" --no-git-tag-version)" >> "$GITHUB_ENV"

      - name: Sync version into plugin manifests
        run: bun run sync-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump and push to main
        run: |
          git add -A
          git commit -m "chore: release $RELEASE_VERSION"
          git push origin main

      - name: Create and push tag
        run: |
          git tag "$RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"
          echo "Tagged $RELEASE_VERSION"

      - name: Authenticate with npm
        run: npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        run: bun scripts/release-notes.ts > "$RUNNER_TEMP/release-notes.md"

      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest "$RUNNER_TEMP"/*.tgz
