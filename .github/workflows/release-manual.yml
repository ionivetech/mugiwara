name: Manual Release

# Manual release from GitHub UI: after PRs merge into main, run this workflow,
# pick patch/minor/major (or an exact version), and it bumps the version,
# syncs the plugin manifests, commits + tags main, then publishes to npm and
# creates the GitHub Release — all in this one run.
#
# Why not trigger the Release workflow via the tag push? Pushes made with the
# GITHUB_TOKEN do not fire other workflows (GitHub limitation). So this
# workflow publishes directly instead of relying on the `v*` tag trigger.
#
# Usage: Actions tab -> "Manual Release" -> "Run workflow" -> choose version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump — patch | minor | major, or exact (e.g. 0.3.0)'
        required: true
        default: patch

concurrency:
  group: manual-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # npm provenance attestation (socket.dev supply-chain score)

jobs:
  release:
    name: "Release ${{ inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: "Install dependencies"
        run: bun install --frozen-lockfile

      # One gate, one definition — the same rule ci.yml states. This step used
      # to re-list the checks by hand, and it drifted twice over: it ran a
      # fraction of the gate, and `--check-sync` exits early, so the
      # --check-manifest and --check-docs on that same line never ran at all.
      # A release was pre-flighting plugin-copy sync and nothing else.
      - name: "Pre-flight (single source of truth: package.json `gate`)"
        run: bun run gate

      - name: "Bump version"
        run: echo "RELEASE_VERSION=$(npm version "${{ inputs.version }}" --no-git-tag-version)" >> "$GITHUB_ENV"

      - name: "Sync manifests"
        run: bun run sync-version

      - name: "Configure git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Commit version bump + push"
        run: |
          git add -A
          git commit -m "chore: release $RELEASE_VERSION"
          git push origin main

      # Notes are generated BEFORE tagging so the tag can carry them. Because
      # the release tag does not exist yet, the newest tag IS the previous
      # release and is the correct boundary — no --tagged-head here. Passing it
      # (or generating after tagging without it) skips a whole release.
      - name: "Generate release notes"
        run: bun scripts/release-notes.ts > "$RUNNER_TEMP/release-notes.md"

      # An annotated tag, not a lightweight one. A lightweight tag is a bare
      # pointer: `git tag -n` shows the commit subject it happens to land on,
      # which for a release is always "chore: release vX.Y.Z" and tells a
      # reader nothing. An annotated tag is its own object with a tagger,
      # a date, and a message that survives in the clone.
      - name: "Create and push tag"
        run: |
          {
            echo "mugiwara $RELEASE_VERSION"
            echo
            echo "Package:  @ionivetech/mugiwara@${RELEASE_VERSION#v}"
            echo "Released: $(date -u +%Y-%m-%d)"
            echo "Commit:   $(git rev-parse --short HEAD)"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "Verified in CI before tagging: typecheck, unit tests, build, content validation."
          } > "$RUNNER_TEMP/tag-message.txt"
          git tag -a "$RELEASE_VERSION" -F "$RUNNER_TEMP/tag-message.txt"
          git push origin "$RELEASE_VERSION"
          echo "Tagged $RELEASE_VERSION (annotated)"

      - name: "Authenticate with npm"
        run: npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"

      - name: "Publish to npm"
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Pack tarball"
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: "Create GitHub Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest "$RUNNER_TEMP"/*.tgz
