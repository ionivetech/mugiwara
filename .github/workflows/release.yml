name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback: a tag pushed by another workflow's GITHUB_TOKEN does NOT
  # trigger the push event (GitHub limitation). Use "Run workflow" on this
  # workflow, pick the tag ref (e.g. v0.3.0), and it publishes that tag.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # npm provenance attestation (socket.dev supply-chain score)

jobs:
  publish:
    name: "Publish ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: "Install dependencies"
        run: bun install --frozen-lockfile

      - name: "Typecheck"
        run: bun run typecheck

      - name: "Unit tests"
        run: bun run test

      - name: "Build"
        run: bun run build

      - name: "Validate content"
        run: bun scripts/validate-content.ts --check-manifest --check-docs

      - name: "Authenticate with npm"
        run: npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"

      - name: "Publish to npm"
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Generate release notes"
        run: bun scripts/release-notes.ts > "$RUNNER_TEMP/release-notes.md"

      - name: "Pack tarball"
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: "Create GitHub Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest "$RUNNER_TEMP"/*.tgz

# Release flow: create a tag with `npm version <patch|minor|major>` (bumps
# package.json version and pushes the tag), or manually with `git tag vX.Y.Z
# && git push origin vX.Y.Z`. The `v*` tag trigger publishes to npm and creates
# the GitHub Release with auto-generated notes. Note: a tag pushed by the
# Manual Release workflow (GITHUB_TOKEN) does not fire this workflow — trigger
# it via workflow_dispatch on that tag instead.
